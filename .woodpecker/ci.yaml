# CI mínimo (QUARK-289 F5): build e testes que o repo já tem, em todo push e PR.
when:
  - event: push
  - event: pull_request
  - event: manual

steps:
  - name: install
    image: oven/bun:1.4.0-debian@sha256:5bb0f9be3a1a36a03e27c9a9dd894a3b1ad26657155c7df4dda771e17bf872ef
    commands:
      - bun install --frozen-lockfile
  - name: build
    image: oven/bun:1.4.0-debian@sha256:5bb0f9be3a1a36a03e27c9a9dd894a3b1ad26657155c7df4dda771e17bf872ef
    commands:
      - bun run build
